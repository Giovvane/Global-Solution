<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/main.css" />
  <script src="../js/contato.js"></script>

  <title>Contato</title>
</head>

<body>

  <header class="cabecalho contato-header">
    <a href="index.html">
      <img src="../assets/Logo FT.jpg" alt="Logo" class="cabecalho_logo">
    </a>

    <h1 class="contatar">
      Como gostaria de nos contatar?
    </h1>
  </header>

  <main class="container-pagina">

    <div class="contatos">
      <h2>Meios de Contato</h2>

      <div class="item-contato">
        <img src="../assets/whatsapp.jpg" alt="Logo Whatsapp" class="icone-contato">
        <p><b>WhatsApp:</b> (11) 94357-8228</p>
      </div>

      <div class="item-contato">
        <img src="../assets/Gmail logo.jpg" alt="Logo Gmail" class="icone-contato">
        <p><b>E-mail:</b> giovanedc2007@gmail.com</p>
      </div>
    </div>

    <div class="container-contato">
      <form id="meuFormulario">
        <h2>Formulário de Contato</h2>
        <input type="text" placeholder="Coloque seu nome" aria-label="Nome completo">
        <input type="email" placeholder="Coloque um email válido" aria-label="Seu endereço de email">
        <textarea placeholder="Coloque sua mensagem" aria-label="Sua mensagem para nós"></textarea>
        <button type="submit">Enviar</button>
      </form>
    </div>

  </main>

</body>

</html>
